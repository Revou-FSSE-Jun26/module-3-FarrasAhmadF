<!DOCTYPE html>
<html lang="en">
    <head>
        <meta chatset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="assignment-3.css" />
        <script src="assignment-3.js" defer></script>
        <title>Profile page</title>
    </head>
    <body> 
        <header class="profile-page">
            <h1>Profile <span>Directory</span></h1>
            <p class="tagline">List of all users</p>
        </header>

        <section class="controls">
            <input id="search" type="text" placeholder="Search user...." />
        </section>
        
        <main id="grid"></main>
        <section class="add">
            <h2>Contact form:</h2>
            <form id="add-contact">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Write you name here..." />
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Write your email here..." />
                <label for="origin">Origin</label>
                <input type="text" id="origin" name="origin" placeholder="Write your origin here..." />
                <label for="phone">Phone Number</label>
                <input type="number" id="phone" name="phone" required placeholder="Write your phone number here..." />
                <button type="submit">Add Contact</button>
            </form>
        </section>
        <footer>
            <p>&copy; 2026 Farras A F</p>
        </footer>
    </body>
</html>
