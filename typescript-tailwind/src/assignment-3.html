<!DOCTYPE html>
<html lang="en">
<script src="../dist/assignment-3.js" type="module"></script>
<link href="../dist/output.css" rel="stylesheet" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<div class="min-h-screen bg-gray-100 p-4 md:p-8">

    <header class="max-w-6xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
        <h1 class="text-2xl md:text-4xl font-bold text-gray-900">Revo Coffee Catalogue</h1>
        <input id="search" type="text" placeholder="Search products..."
        class="w-full md:w-72 px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" />
    </header>

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">

        <div id="grid" class="lg:col-span-3 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6"></div>

        <aside class="bg-white rounded-xl shadow-md p-4 h-fit lg:sticky lg:top-4">
            <h2 class="text-lg font-bold text-gray-900 border-b pb-2">Cart Summary</h2>
            <p class="mt-3 text-gray-600">Items: <span id="cart-count" class="font-semibold text-gray-900">0 items</span></p>
            <p class="mt-1 text-gray-600">Total: <span id="cart-total" class="font-bold text-blue-600">Rp 0</span></p>
        </aside>

    </div>
    <footer class="mt-3">
        <p>&copy; 2026 Farras A. F.</p>
    </footer>
</div>
</html>
